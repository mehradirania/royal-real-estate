<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت رویال</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>body{background:#f6f6f6}.admin{padding:30px 0}.panel{background:#fff;border:1px solid #eee;border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:0 8px 25px #0000000a}.admin h1{margin-top:0}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form-grid.full{grid-template-columns:1fr}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.field textarea{min-height:100px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer}.primary{background:linear-gradient(110deg,#a87400,#f1c94d);color:#111}.danger{background:#171717;color:#fff}.post-row{display:grid;grid-template-columns:100px 1fr auto;gap:15px;align-items:center;border:1px solid #eee;padding:12px;border-radius:14px;margin:10px 0}.post-row img{width:100px;height:75px;object-fit:cover;border-radius:10px}.social-row{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;margin-bottom:10px}.login{max-width:420px;margin:100px auto}.hidden{display:none!important}.hint{color:#777;font-size:13px}@media(max-width:700px){.form-grid,.social-row{grid-template-columns:1fr}.post-row{grid-template-columns:80px 1fr}.post-row .actions{grid-column:1/-1}.post-row img{width:80px;height:65px}}</style></head><body><div id="login" class="login container panel"><h1>ورود مدیریت رویال</h1><div class="field"><label>نام کاربری</label><input id="user"></div><div class="field"><label>رمز عبور</label><input id="pass" type="password"></div><div class="actions"><button class="btn primary" onclick="login()">ورود به پنل</button></div><p class="hint">ورود نمایشی نسخه دمو: admin / admin123</p></div>
<div id="dashboard" class="hidden admin container"><div class="panel"><h1>پنل مدیریت رویال</h1><p>شماره تماس، اطلاعات تماس، شبکه‌های اجتماعی و آگهی‌ها از همین‌جا قابل تغییر هستند.</p><div class="actions"><a class="btn primary" href="index.html">مشاهده سایت</a><button class="btn danger" onclick="logout()">خروج</button></div></div>
<div class="panel"><h2>اطلاعات تماس و شبکه‌های اجتماعی</h2><div class="form-grid"><div class="field"><label>شماره تماس</label><input id="phone"></div><div class="field"><label>آدرس دفتر</label><input id="address"></div></div><div class="field"><label>متن تماس</label><textarea id="contactText"></textarea></div><h3>شبکه‌های اجتماعی</h3><div id="socialEditor"></div><div class="actions"><button class="btn" onclick="addSocial()">+ افزودن شبکه اجتماعی</button><button class="btn primary" onclick="saveSettings()">ذخیره تنظیمات</button></div></div>
<div class="panel"><h2 id="postFormTitle">افزودن آگهی جدید</h2><input type="hidden" id="postId"><div class="form-grid"><div class="field"><label>عنوان ملک</label><input id="title"></div><div class="field"><label>منطقه</label><input id="location"></div><div class="field"><label>متراژ</label><input id="area"></div><div class="field"><label>تعداد خواب</label><input id="rooms"></div><div class="field"><label>قیمت</label><input id="price"></div><div class="field"><label>لینک تصویر</label><input id="image"></div></div><div class="field"><label>یا تصویر را از گوشی انتخاب کنید</label><input id="imageFile" type="file" accept="image/*"></div><div class="actions"><label><input id="featured" type="checkbox" checked> نمایش در پیشنهاد رویال</label></div><div class="actions"><button class="btn primary" onclick="savePost()">ذخیره آگهی</button><button class="btn" onclick="resetPost()">پاک کردن فرم</button></div></div>
<div class="panel"><h2>آگهی‌های موجود</h2><div id="postsList"></div></div></div><script src="admin.js"></script></body></html>
